[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slow-fast-idp-hopfield"
version = "1.1.0"
description = "Reproducible simulations for slow-fast sequential IDP Hopfield networks"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "pandas==2.2.3",
  "matplotlib==3.10.8",
  "PyYAML==6.0.3",
  "tqdm==4.67.3",
  "numba==0.65.1",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
artifacts = ["Pillow==12.3.0", "reportlab==4.4.9", "pypdf==6.10.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
